services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/var/data
      - PORT=3000
    volumes:
      - ./data:/var/data
    expose: ["3000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  caddy_data:
